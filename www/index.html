<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#3f8f3a">
  <meta name="description" content="Nuggs Farm: breed, raise and show 68 species of animals.">
  <title>Nuggs Farm</title>
  <link rel="icon" href="img/icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="hud"></header>
    <div id="event" hidden></div>
    <div id="worldwrap" hidden>
      <canvas id="world"></canvas>
      <div id="wui"></div>
      <button id="interact" class="btn go" data-act="interact" hidden></button>
    </div>
    <main id="view"></main>
    <nav id="nav"></nav>
  </div>
  <div id="modal" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
